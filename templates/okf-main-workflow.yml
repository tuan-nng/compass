# Bundle check for a branch-mode repo. Commit this file only to okf/main, as
# .github/workflows/okf.yml; the code branches never carry it. The bundle root
# is the branch root, so the check runs on ".".
#
# Before committing, replace OKF_ORG with the account that owns compass and
# COMPASS_SHA with the full commit SHA of the compass version to use.
name: okf

on:
  pull_request:
    branches: [okf/main]
  push:
    branches: [okf/main]

permissions:
  contents: read

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The pull request head, not the merge commit GitHub would check out.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: OKF_ORG/compass/actions/bundle-check@COMPASS_SHA
        with:
          bundle: .
