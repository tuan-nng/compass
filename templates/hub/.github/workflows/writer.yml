# Writer workflow, stored in your hub repo as .github/workflows/writer.yml.
# It runs the sync job and the stamper every 30 minutes and on manual
# dispatch, with the writer app's token.
#
# The okf-write environment holds the writer app's key and only the hub's
# default branch may use it (plan decision 14). Set in that environment
# (`compass app create --role writer` sets both):
#   variable OKF_WRITER_CLIENT_ID  - the writer app's client ID
#   secret   OKF_WRITER_PRIVATE_KEY - the writer app's private key
#
# Before committing, replace OKF_ORG with the account that owns compass and
# COMPASS_SHA with the full commit SHA of the compass version to use.
name: writer

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would change without writing
        type: boolean
        default: false

# One queue for every writer run: a scheduled and a manual run never overlap,
# and no run is cancelled.
concurrency:
  group: okf-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: okf-write
    steps:
      - name: Mint writer app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OKF_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.OKF_WRITER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: OKF_ORG/compass/actions/writer@COMPASS_SHA
        with:
          org: ${{ github.repository_owner }}
          hub-dir: .
          token: ${{ steps.token.outputs.token }}
          dry-run: ${{ inputs.dry-run == true }}
