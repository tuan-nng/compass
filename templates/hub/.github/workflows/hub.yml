# Hub CI, stored in your hub repo as .github/workflows/hub.yml.
# Runs nightly, on manual dispatch, and on hub pull requests, including when a
# draft is marked ready for review. No repo pipeline triggers it (plan
# decision 15): a hub pull request that waits on a repo change goes green when
# its check is re-run after that change merges.
#
# Before committing, replace OKF_ORG with the account that owns compass and
# COMPASS_SHA with the full commit SHA of the compass version to use.
# Needs the reader app: variable OKF_READER_CLIENT_ID and secret
# OKF_READER_PRIVATE_KEY (`compass app create --role reader` sets both).
name: hub

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - name: Reader token
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OKF_READER_CLIENT_ID }}
          private-key: ${{ secrets.OKF_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: OKF_ORG/compass/actions/hub@COMPASS_SHA
        with:
          token: ${{ steps.reader.outputs.token }}
